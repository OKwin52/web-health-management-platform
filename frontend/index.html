<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Health Management</title>
    <link rel="stylesheet" href="/frontend/style.css" />
  </head>
  <body>
    <header class="header">
      <h1>Personal Health Management</h1>
      <button id="logoutBtn" class="hidden">Logout</button>
    </header>

    <main class="container">
      <section id="loginPanel" class="panel">
        <h2>Login</h2>
        <p class="hint">Please login to view patient archive data.</p>
        <form id="loginForm">
          <label>
            Username
            <input id="username" name="username" required placeholder="admin" />
          </label>
          <label>
            Password
            <input id="password" name="password" required type="password" placeholder="admin123" />
          </label>
          <button type="submit">Sign in</button>
        </form>
        <p id="loginMessage" class="message"></p>
      </section>

      <section id="dashboard" class="hidden">
        <div class="panel">
          <div class="panel-head">
            <h2>Patients</h2>
            <button id="refreshPatientsBtn">Refresh</button>
          </div>
          <p class="hint">Click one patient to view archive details.</p>
          <div id="patientsList" class="patient-list"></div>
        </div>

        <div class="panel">
          <h2 id="detailTitle">Patient details</h2>
          <div id="patientMeta" class="patient-meta"></div>

          <div class="tabs">
            <button class="tab active" data-resource="encounters">Encounters</button>
            <button class="tab" data-resource="conditions">Conditions</button>
            <button class="tab" data-resource="medications">Medications</button>
            <button class="tab" data-resource="observations">Observations</button>
          </div>

          <div id="detailBody" class="detail-body">
            <p class="hint">Select a patient first.</p>
          </div>
        </div>
      </section>
    </main>

    <script src="/frontend/app.js"></script>
  </body>
</html>
